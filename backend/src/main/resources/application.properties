
spring.application.name=retail-media-backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/retail_media_platform
spring.datasource.username=retailmedia
spring.datasource.password=${POSTGRES_PASSWORD}

# Load the local database password from the root .env file
spring.config.import=optional:file:../.env[.properties]

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application server
server.port=8080
